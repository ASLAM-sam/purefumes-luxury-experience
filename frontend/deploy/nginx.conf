server {
  listen 80;
  server_name purefumeshyderabad.com www.purefumeshyderabad.com;

  root /var/www/purefumes/frontend/dist/client;
  index index.html;

  location /api/ {
    proxy_pass https://api.purefumeshyderabad.com/api/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.purefumeshyderabad.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass https://api.purefumeshyderabad.com/auth/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.purefumeshyderabad.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass https://api.purefumeshyderabad.com/uploads/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.purefumeshyderabad.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
