upstream purefumes_api {
  least_conn;
  server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
  listen 80;
  listen 443 ssl http2;
  server_name purefumeshyderabad.in www.purefumeshyderabad.in;

  root /var/www/purefumes/frontend/dist/client;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  client_max_body_size 20m;
  keepalive_timeout 65;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen 443 ssl http2;
  server_name api.purefumeshyderabad.in;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss;

  client_max_body_size 20m;
  keepalive_timeout 65;
  proxy_http_version 1.1;
  proxy_buffering on;
  proxy_buffers 32 16k;
  proxy_busy_buffers_size 64k;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://purefumes_api/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }

  location /auth/ {
    limit_req zone=auth burst=15 nodelay;
    proxy_pass http://purefumes_api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }

  location /uploads/ {
    proxy_pass http://purefumes_api/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
