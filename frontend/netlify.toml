[build]
  command = "npm run build"
  publish = "dist/client"

[[redirects]]
  from = "/api/*"
  to = "https://hydpurefumes.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://hydpurefumes.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://hydpurefumes.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
